# ---------------------------------------------------------------------------
# Testnet profile — overrides application.yml for testnet chain testing
# Activate with: --spring.profiles.active=testnet
#
# Alchemy RPC URLs:
#   EVM_ETHEREUM_RPC_URL  -> Sepolia: https://eth-sepolia.g.alchemy.com/v2/YOUR_KEY
#   EVM_BASE_RPC_URL      -> Base Sepolia: https://base-sepolia.g.alchemy.com/v2/YOUR_KEY
#   EVM_POLYGON_RPC_URL   -> Polygon Amoy: https://polygon-amoy.g.alchemy.com/v2/YOUR_KEY
#   SOLANA_RPC_URL        -> Solana Devnet: https://solana-devnet.g.alchemy.com/v2/YOUR_KEY
# ---------------------------------------------------------------------------

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}

str:
  api:
    key: ${STR_API_KEY}
  nonce:
    enabled: true
  kafka:
    enabled-chains: ethereum_sepolia,solana_devnet

  chains:
    ethereum_sepolia:
      enabled: true
      chain-family: EVM
      chain-id: 11155111
      finality-blocks: 3
      stuck-threshold-blocks: 10
      poll-interval: PT12S
      max-fee-cap-gwei: 50
      token-contracts:
        - "0x1c7D4B196Cb0C7B01d743Fbc6116a902379C7238"
      rpc:
        urls:
          - ${EVM_ETHEREUM_RPC_URL:https://eth-sepolia.g.alchemy.com/v2/demo}
        timeout: PT10S
        max-retries: 3
        rate-limit-rps: 5
        rate-limit-burst: 10
        circuit-breaker:
          failure-rate-threshold: 50
          wait-duration-in-open-state: PT30S
          sliding-window-size: 10

    base_mainnet:
      enabled: false

    polygon_mainnet:
      enabled: false

    solana_devnet:
      enabled: true
      chain-family: SOLANA
      chain-id: 0
      finality-blocks: 31
      stuck-threshold-blocks: 300
      poll-interval: 1s
      token-mints:
        - "4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU"
      rpc:
        urls:
          - ${SOLANA_RPC_URL:https://solana-devnet.g.alchemy.com/v2/demo}
        timeout: PT10S
        max-retries: 3
        rate-limit-rps: 5
        rate-limit-burst: 10
        circuit-breaker:
          failure-rate-threshold: 50
          wait-duration-in-open-state: PT30S
          sliding-window-size: 10

  escalation:
    default-tiers:
      - level: 0
        stuck-threshold: PT0S
        gas-multiplier: 1.0
        requires-human-approval: false
        description: Initial detection - wait
      - level: 1
        stuck-threshold: PT30S
        gas-multiplier: 1.25
        requires-human-approval: false
        description: First speed-up (testnet — faster thresholds)
      - level: 2
        stuck-threshold: PT1M
        gas-multiplier: 2.0
        requires-human-approval: false
        description: Second speed-up
      - level: 3
        stuck-threshold: PT3M
        gas-multiplier: 3.0
        requires-human-approval: true
        description: Human escalation (testnet — lower threshold)
