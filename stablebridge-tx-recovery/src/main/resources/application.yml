spring:
  application:
    name: stablebridge-tx-recovery
  autoconfigure:
    exclude:
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration
      - org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration
      - io.temporal.spring.boot.autoconfigure.TemporalAutoConfiguration

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:str}
    username: ${DB_USERNAME:str}
    password: ${DB_PASSWORD:str}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

str:
  signer:
    backend: ${STR_SIGNER_BACKEND:}
    keystore-path: ${STR_SIGNER_KEYSTORE_PATH:}
    password: ${STR_SIGNER_PASSWORD:}
    callback:
      hmac-secret: ${STR_SIGNER_CALLBACK_HMAC_SECRET:}
      timeout: PT5S
      tls:
        verify: true
  kafka:
    enabled-chains: ethereum_mainnet,solana_mainnet
    topic-replicas: 1
  evm:
    chains:
      - name: ethereum
        rpc-urls:
          - ${EVM_ETHEREUM_RPC_URL:http://localhost:8545}
        max-fee-cap-gwei: 200
        block-time: PT12S
        rpc-timeout: PT5S
        rate-limit-per-second: 25
        rate-limit-burst: 50
      - name: base
        rpc-urls:
          - ${EVM_BASE_RPC_URL:http://localhost:8546}
        max-fee-cap-gwei: 5
        block-time: PT2S
        rpc-timeout: PT5S
        rate-limit-per-second: 25
        rate-limit-burst: 50
      - name: polygon
        rpc-urls:
          - ${EVM_POLYGON_RPC_URL:http://localhost:8547}
        max-fee-cap-gwei: 500
        block-time: PT2S
        rpc-timeout: PT5S
        rate-limit-per-second: 25
        rate-limit-burst: 50
  temporal:
    target: ${TEMPORAL_FRONTEND_URL:127.0.0.1:7233}
    namespace: stablebridge-tx-recovery
    task-queue: str-transaction-lifecycle
    workflow-execution-timeout: PT24H
    workflow-run-timeout: PT2H
    non-retryable-exceptions:
      - com.stablebridge.txrecovery.domain.exception.NonRetryableException
      - com.stablebridge.txrecovery.domain.exception.NonceTooLowException
    activity-options:
      default-options:
        start-to-close-timeout: PT30S
        max-attempts: 3
        initial-interval: PT1S
        backoff-coefficient: 2.0
      signing:
        start-to-close-timeout: PT10S
        max-attempts: 2
        initial-interval: PT1S
        backoff-coefficient: 2.0
      confirmation:
        start-to-close-timeout: PT300S
        max-attempts: 1
        initial-interval: PT1S
        backoff-coefficient: 2.0
      recovery-execution:
        start-to-close-timeout: PT60S
        max-attempts: 3
        initial-interval: PT1S
        backoff-coefficient: 2.0
  escalation:
    high-value-threshold-usd: 50000
    gas-budget:
      percentage: 0.01
      absolute-min-usd: 5
      absolute-max-usd: 500
    default-tiers:
      - level: 0
        stuck-threshold: PT0S
        gas-multiplier: 1.0
        requires-human-approval: false
        description: Initial detection - wait
      - level: 1
        stuck-threshold: PT1M
        gas-multiplier: 1.25
        requires-human-approval: false
        description: First speed-up
      - level: 2
        stuck-threshold: PT3M
        gas-multiplier: 2.0
        requires-human-approval: false
        description: Second speed-up
      - level: 3
        stuck-threshold: PT10M
        gas-multiplier: 3.0
        requires-human-approval: false
        description: Aggressive speed-up
      - level: 4
        stuck-threshold: PT30M
        gas-multiplier: 3.0
        requires-human-approval: true
        description: Human escalation
    high-value-tiers:
      - level: 0
        stuck-threshold: PT0S
        gas-multiplier: 1.0
        requires-human-approval: false
        description: Initial detection - wait
      - level: 1
        stuck-threshold: PT1M
        gas-multiplier: 1.25
        requires-human-approval: false
        description: First speed-up
      - level: 2
        stuck-threshold: PT5M
        gas-multiplier: 1.25
        requires-human-approval: true
        description: Human escalation for high-value
  submission:
    sequential-threshold-usd: 100000
    max-pipeline-depth: 20
  redis:
    host: ${STR_REDIS_HOST:localhost}
    port: ${STR_REDIS_PORT:6379}
  chains:
    ethereum_mainnet:
      enabled: true
      chain-family: EVM
      chain-id: 1
      finality-blocks: 12
      stuck-threshold-blocks: 250
      poll-interval: PT12S
      max-fee-cap-gwei: 200
      token-contracts:
        - "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
        - "0xdAC17F958D2ee523a2206206994597C13D831ec7"
      rpc:
        urls:
          - ${EVM_ETHEREUM_RPC_URL:http://localhost:8545}
        timeout: PT5S
        max-retries: 3
        rate-limit-rps: 25
        rate-limit-burst: 50
        circuit-breaker:
          failure-rate-threshold: 50
          wait-duration-in-open-state: PT30S
          sliding-window-size: 10
    base_mainnet:
      enabled: true
      chain-family: EVM
      chain-id: 8453
      finality-blocks: 1
      stuck-threshold-blocks: 100
      poll-interval: PT2S
      max-fee-cap-gwei: 5
      token-contracts:
        - "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
      rpc:
        urls:
          - ${EVM_BASE_RPC_URL:http://localhost:8546}
        timeout: PT5S
        max-retries: 3
        rate-limit-rps: 25
        rate-limit-burst: 50
        circuit-breaker:
          failure-rate-threshold: 50
          wait-duration-in-open-state: PT30S
          sliding-window-size: 10
    polygon_mainnet:
      enabled: true
      chain-family: EVM
      chain-id: 137
      finality-blocks: 256
      stuck-threshold-blocks: 500
      poll-interval: PT2S
      max-fee-cap-gwei: 500
      token-contracts:
        - "0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359"
        - "0xc2132D05D31c914a87C6611C10748AEb04B58e8F"
      rpc:
        urls:
          - ${EVM_POLYGON_RPC_URL:http://localhost:8547}
        timeout: PT5S
        max-retries: 3
        rate-limit-rps: 25
        rate-limit-burst: 50
        circuit-breaker:
          failure-rate-threshold: 50
          wait-duration-in-open-state: PT30S
          sliding-window-size: 10
    solana_mainnet:
      enabled: true
      chain-family: SOLANA
      chain-id: 0
      finality-blocks: 31
      stuck-threshold-blocks: 150
      poll-interval: 400ms
      token-mints:
        - "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"
      rpc:
        urls:
          - ${SOLANA_RPC_URL:http://localhost:8899}
        timeout: PT5S
        max-retries: 3
        rate-limit-rps: 25
        rate-limit-burst: 50
        circuit-breaker:
          failure-rate-threshold: 50
          wait-duration-in-open-state: PT30S
          sliding-window-size: 10

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: always
